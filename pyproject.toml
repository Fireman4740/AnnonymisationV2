[project]
name = "anonymisation-v2"
version = "0.1.0"
description = "Détection de quasi-identifiants indirects et anonymisation pilotée par le risque de ré-identification"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mathis Carlesso" }]

dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "numpy>=1.26",
  "pandas>=2.2",
]

[project.optional-dependencies]
datasets = [
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "lxml>=5.2",
]
models = [
  "torch>=2.3",
  "transformers>=4.41",
  "gliner>=0.2",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
]
metrics = [
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "bert-score>=0.3.13",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
anonv2 = "anonymisation.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anonymisation"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "requires_data: nécessite un dataset téléchargé localement",
  "restricted_license: nécessite un dataset sous licence restrictive (MIMIC, MEDDOCAN)",
  "slow: test long (LLM, attaquant)",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/anonymisation"]
