[project]
name = "anonymisation-v2"
version = "0.1.0"
description = "Détection de quasi-identifiants indirects et anonymisation pilotée par le risque de ré-identification"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mathis Carlesso" }]

# Noyau volontairement minimal : l'import du coeur ne doit dépendre ni d'un
# fournisseur LLM, ni de CUDA, ni de GLiNER, ni de Streamlit (leçon de l'audit
# v1, §12.9). La CLI utilise argparse (stdlib), pas typer.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  # Schémas de spans de référence (SemEval-2013 9.1) : pur Python, sans
  # dépendance. Version ÉPINGLÉE : les schémas ont changé entre versions.
  # nervaluate 1.x exige Python >= 3.11 (comme correctmatch) : d'où le minimum.
  "nervaluate==1.2.1",
]

[project.optional-dependencies]
# Lecture des corpus locaux (parquet : SupportTicketsReal, PUMS de RAT-Bench).
datasets = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15.0",
]
# Acquisition de sources distantes — inutile pour les corpus déjà en cache local.
download = [
  "datasets>=2.19",
  "huggingface-hub>=0.23",
  "lxml>=5.2",
]
models = [
  "torch>=2.3",
  "transformers>=4.41",
  "gliner>=0.2",
  "presidio-analyzer>=2.2",
  "spacy>=3.7",
]
metrics = [
  "numpy>=1.26",
  "scipy>=1.13",
]
# Métriques d'utilité textuelle (secondaires — voir SPEC-07 §6.A).
metrics_text = [
  "scikit-learn>=1.5",
  "bert-score>=0.3.13",
]
# Étape figée d'attaque RAT-Bench (anonv2 attack) : attaquant LLM via OpenRouter,
# jugement par Jaro-Winkler, risque CorrectMatch (Julia, installé au premier
# appel par juliacall). Jamais requise par predict ni score (C1, C5).
attack = [
  "openai>=1.0",
  "rapidfuzz>=3.0",
  "rouge-score>=0.1.2",
  "correctmatch>=1.4.1",
  "pandas>=2.2",
  "pyarrow>=15.0",
]
# Évaluateur ORIGINAL de TAB (metrics/vendor/tab_evaluation.py, recopié tel
# quel) : spaCy + modèle en_core_web_md exigés par son GoldCorpus. Hors ligne
# une fois installé ; requis par `score` sur le seul corpus `tab`.
tab_eval = [
  "spacy>=3.8,<3.9",
  "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
  "intervaltree>=3.1",
  "tqdm>=4.66",
  "pandas>=2.2",
  "numpy>=1.26",
]
# Pipelines d'anonymisation pilotés par un LLM (anonymisation.pipelines.llm_*).
llm = [
  "openai>=1.0",
]
llm-anthropic = [
  "anthropic>=0.30",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.10",
]

[project.scripts]
anonv2 = "anonymisation.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Le modèle spaCy de l'évaluateur TAB n'est publié que comme roue GitHub
# (référence directe, figée par uv.lock avec son empreinte).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/anonymisation"]
# Les tests des pipelines vivent dans le paquet (dossier autonome par
# architecture) mais n'ont pas à être distribués.
exclude = ["**/tests/**"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 is retained as formatter guidance; UP042 would require Python 3.11
# StrEnum and break the documented Python 3.10 compatibility.
ignore = ["E501", "UP042", "SIM117"]

[tool.pytest.ini_options]
# Les pipelines embarquent leurs propres tests dans leur dossier autonome
# (src/anonymisation/pipelines/<nom>/tests/) : pytest doit les découvrir là.
testpaths = ["tests", "src/anonymisation/pipelines"]
addopts = "-q"
markers = [
  "requires_data: nécessite un dataset téléchargé localement",
  "restricted_license: nécessite un dataset sous licence restrictive (MIMIC, MEDDOCAN)",
  "slow: test long (LLM, attaquant)",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
files = ["src/anonymisation"]
