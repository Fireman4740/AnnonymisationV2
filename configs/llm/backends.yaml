# Backends LLM interchangeables — SPEC-10 §6.1
#
# La clé d'API n'est JAMAIS écrite ici : elle est lue à l'exécution via
# `api_key_cmd` ou `api_key_env`.
#
# Le backend utilisé est enregistré dans PipelineTrace et dans tout rapport :
# un résultat obtenu avec Sonnet n'est pas comparable à un résultat Qwen.

default: qwen_local

backends:

  # --- Modèle local, défaut du projet ------------------------------------- #
  # Serveur vLLM Qwen3.8-27B (W4A16), piloté par F:\IA\Qwen3.8\qwen.ps1
  #   start | stop | status | logs | key | chat | restart
  # Respecte la contrainte projet « modèles locaux < 30 B ».
  qwen_local:
    kind: openai_compatible
    base_url: "http://127.0.0.1:18020/v1"
    model: "qwen3.8-27b"
    api_key_cmd: >-
      wsl.exe -d Ubuntu -- bash -lc
      "cd ~/qwen38-27b-rtx3090 && grep VLLM_API_KEY .env | cut -d= -f2"
    timeout_s: 90
    max_concurrency: 4          # borné par la VRAM du RTX 3090
    temperature: 0.1            # détection : on cherche la précision
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
    health:
      url: "http://127.0.0.1:18020/health"
      # Message affiché si le serveur ne répond pas : actionnable, pas un
      # timeout opaque (SPEC-10 §6.4).
      hint: "Serveur local éteint. Démarrer : powershell -File F:\\IA\\Qwen3.8\\qwen.ps1 start (2-3 min au premier boot)"

  # --- Borne supérieure de qualité / attaquant B -------------------------- #
  sonnet:
    kind: anthropic
    model: "claude-sonnet-5"
    api_key_env: "ANTHROPIC_API_KEY"
    timeout_s: 60
    max_concurrency: 8
    temperature: 0.1

  # --- Évaluation : attaquant RAT-Bench et juge d'utilité (OpenRouter) ---- #
  # Modèles GRATUITS d'OpenRouter, réservés aux étapes d'ÉVALUATION (attaque,
  # juge) — jamais à un système d'anonymisation évalué. Gemma 4 26B (A4B)
  # respecte la contrainte « < 30 B » ; Nemotron Super (120B A12B) est une
  # référence externe explicite supérieure à la limite des modèles locaux,
  # jamais un repli automatique. Un seul modèle par campagne : un
  # taux de ré-identification n'est comparable qu'à attaquant identique.
  # Température 0 + cache disque : une campagne se rejoue à l'identique.
  openrouter_gemma4_26b:
    kind: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    model: "google/gemma-4-26b-a4b-it:free"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_s: 180
    max_retries: 5
    max_concurrency: 2          # palier gratuit : débit partagé, 429 fréquents
    temperature: 0.0
    extra_body:
      provider:
        max_price: {prompt: 0, completion: 0}
  openrouter_nemotron_super:
    kind: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    model: "nvidia/nemotron-3-super-120b-a12b:free"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_s: 300
    max_retries: 5
    max_concurrency: 2
    temperature: 0.0
    extra_body:
      provider:
        max_price: {prompt: 0, completion: 0}

  # Campagne autorisée via API : anonymiseur externe distinct du juge.
  openrouter_liquid_2_6b:
    kind: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    model: "liquid/lfm-2.5-2.6b:free"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_s: 180
    max_retries: 5
    max_concurrency: 1
    temperature: 0.0
    extra_body:
      provider:
        max_price: {prompt: 0, completion: 0}


  # Campagne du 2026-10-13 : un seul modèle pour tous les rôles distants
  # (anonymiseur llm-full, attaquants RAT-Bench et SPIA, juge), choisi par
  # l'utilisateur. MoE 560B (25B actifs) : référence EXTERNE, au-delà de la
  # contrainte « < 30 B » des modèles locaux. Raisonnement hybride activé
  # par défaut chez le fournisseur : il consomme le budget `max_tokens`.
  openrouter_ling_3_1_flash:
    kind: openai_compatible
    base_url: "https://openrouter.ai/api/v1"
    model: "inclusionai/ling-3.1-flash"
    api_key_env: "OPENROUTER_API_KEY"
    timeout_s: 600
    max_retries: 5
    max_concurrency: 2          # pool gratuit partagé : 429 fréquents
    temperature: 0.0
    extra_body:
      provider:
        max_price: {prompt: 0, completion: 0}

  # --- Sans LLM : CI, tests, pipeline dégradé ----------------------------- #
  # Permet de faire tourner le pipeline de bout en bout sans GPU (SPEC-10 §6.4).
  null_backend:
    kind: null
    model: null

  # --- Réponse canned, sans réseau : contrat de système inter-architectures #
  # Utilisé UNIQUEMENT par tests/unit/test_system_contract.py (--param
  # backend=stub) pour que llm-full-v1 satisfasse le même contrat que les
  # systèmes hors ligne sans jamais ouvrir de socket en test unitaire.
  # Jamais référencé par un profil de production ni par `roles`.
  stub:
    kind: stub
    model: "stub-no-network"
    extra_body:
      stub_response: '{"entities": []}'

# Rôles : un backend différent peut être affecté à chaque rôle.
# Contrainte méthodologique (SPEC-05 §7) : le modèle GÉNÉRATEUR ne doit pas être
# un modèle évalué comme détecteur, sinon le détecteur reconnaît son propre style.
roles:
  detection: qwen_local
  generation: qwen_local        # à changer quand un second modèle local existe
  attacker_a: qwen_local
  attacker_b: sonnet
  # Référence EXTERNE gratuite : Gemma a renvoyé 429 sur le pool partagé.
  # Ce choix explicite ne change pas la contrainte des modèles LOCAUX évalués.
  attacker_ratbench: openrouter_ling_3_1_flash
  attacker_spia: openrouter_ling_3_1_flash
  utility_judge: openrouter_ling_3_1_flash
  paraphrase: qwen_local

cache:
  enabled: true                 # OBLIGATOIRE (SPEC-10 §6.2)
  dir: "data/interim/llm_cache"
  # Clé = sha256(backend + model + prompt + params).
  # Sans cache, chaque réévaluation recoûte des heures de GPU et les
  # comparaisons entre politiques ne sont plus isolées du bruit du LLM.
