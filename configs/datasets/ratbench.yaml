# Manifeste — RAT-Bench
# Fiche : documentation/datasets/rat-bench.md

key: ratbench
name: "RAT-Bench"
description: "Benchmark end-to-end de risque de ré-identification textuelle avec population US PUMS"
doc: "documentation/datasets/rat-bench.md"
aliases: ["rat-bench", "rat_bench"]

source:
  kind: local
  path: "RAT-Bench"
  path_env: ANONV2_V1_DATASETS
  files: ["english.jsonl", "cache/pums_population.parquet"]
  repo: null
  revision: "v1"
  paper: "arXiv:2602.12806"
  instructions: >
    Définir ANONV2_V1_DATASETS sur la racine des jeux de données V1.
    Les fichiers requis sont RAT-Bench/english.jsonl et RAT-Bench/cache/pums_population.parquet.

license:
  spdx: "UNKNOWN"
  redistribution: false
  restricted: true
  citation: "krco2026ratbench"
  notes: "RAT-Bench benchmark data."

integrity:
  sha256: null
  expected_documents: 300
  expected_profiles: 0

structure:
  domain: generic
  languages: ["en"]
  synthetic: true
  has_profiles: false
  has_combinations: true
  has_organizations: false
  has_tasks: false
  split_by: document
  splits: ["eval"]

annotation:
  split_seed: 42
  split_ratios: {eval: 1.0}
label_map:
  CIT: { identifier_type: QUASI, qi_categories: [GEN_ORIGIN_BELIEF], granularity: COARSE, stability: STABLE }
  DOB: { identifier_type: QUASI, qi_categories: [GEN_AGE], granularity: EXACT, stability: STABLE }
  MAR: { identifier_type: QUASI, qi_categories: [GEN_FAMILY], granularity: COARSE, stability: STABLE }
  SEX: { identifier_type: QUASI, qi_categories: [GEN_GENDER], granularity: COARSE, stability: STABLE }
  ST: { identifier_type: QUASI, qi_categories: [GEN_GEO], granularity: COARSE, stability: VOLATILE }
  SCHL: { identifier_type: QUASI, qi_categories: [GEN_EDUCATION], granularity: COARSE, stability: STABLE }
  OCCP: { identifier_type: QUASI, qi_categories: [GEN_OCCUPATION], granularity: COARSE, stability: VOLATILE }
  ESR: { identifier_type: QUASI, qi_categories: [HR_CONTRACT], granularity: COARSE, stability: VOLATILE }
  RAC2P: { identifier_type: QUASI, qi_categories: [GEN_ORIGIN_BELIEF], granularity: COARSE, stability: STABLE }
  name: { identifier_type: DIRECT, qi_categories: [DIR_NAME], granularity: EXACT, stability: STABLE }
  email: { identifier_type: DIRECT, qi_categories: [DIR_EMAIL], granularity: EXACT, stability: VOLATILE }
  phone number: { identifier_type: DIRECT, qi_categories: [DIR_PHONE], granularity: EXACT, stability: VOLATILE }
  SSN: { identifier_type: DIRECT, qi_categories: [DIR_ID_NUMBER], granularity: EXACT, stability: STABLE }
  credit card number: { identifier_type: DIRECT, qi_categories: [DIR_ACCOUNT], granularity: EXACT, stability: VOLATILE }
  address: { identifier_type: DIRECT, qi_categories: [DIR_ADDRESS], granularity: EXACT, stability: VOLATILE }

evaluation:
  protocol: "ratbench-v1"
  protocol_version: "1"
  official_eligible: false
  default_metric_status: "DIAGNOSTIC"
  granularities: ["document"]
  report_by: ["difficulty", "scenario"]

population:
  population_id: "ratbench-us"
  k_computable: true
  risk_model: "prosecutor"
