# Manifeste — CoNLL-2003 / CleanCoNLL
# Fiche : documentation/datasets/conll2003.md

key: conll2003
name: "CoNLL-2003 NER / CleanCoNLL"
description: "Corpus de référence NER en anglais (Reuters news) avec annotations BIO"
doc: "documentation/datasets/conll2003.md"
aliases: ["conll-2003", "cleanconll", "conll"]

source:
  kind: local
  path: "cleanconll_cache/conll03"
  path_env: ANONV2_V1_DATASETS
  files:
    - train.txt
    - valid.txt
    - test.txt
  repo: null
  revision: "v1"
  paper: "tjongkimsang2003conll"
  instructions: >
    Définir ANONV2_V1_DATASETS sur la racine des jeux de données V1.
    Les fichiers requis sont cleanconll_cache/conll03/{train.txt, valid.txt, test.txt}.

license:
  spdx: "UNKNOWN"
  redistribution: false
  restricted: true
  citation: "tjongkimsang2003conll"
  notes: "Données Reuters sous conditions de recherche académique."

integrity:
  sha256: null
  expected_documents: 20744
  expected_profiles: 0

structure:
  domain: generic
  languages: ["en"]
  synthetic: false
  has_profiles: false
  has_combinations: false
  has_organizations: false
  has_tasks: false
  split_by: document
  splits: ["train", "dev", "test"]

label_map:
  PER: { identifier_type: DIRECT, qi_categories: [DIR_NAME], granularity: EXACT, stability: STABLE }
  ORG: { identifier_type: QUASI, qi_categories: [GEN_AFFILIATION], granularity: COARSE, stability: VOLATILE }
  LOC: { identifier_type: QUASI, qi_categories: [GEN_GEO], granularity: COARSE, stability: VOLATILE }
  MISC: { identifier_type: QUASI, qi_categories: [IGNORED], granularity: COARSE, stability: VOLATILE }

evaluation:
  protocol: "conll-diagnostic"
  protocol_version: "1"
  official_eligible: false
  default_metric_status: "DIAGNOSTIC"
  granularities: ["document", "entity"]
  report_by: ["split"]

population:
  population_id: null
  k_computable: false
