# Motifs déclaratifs de la couche de détection déterministe.
#
# Implémentation normative associée : src/anonymisation/detect/patterns.py
# (chargement, compilation, validation) et src/anonymisation/detect/rules.py
# (règles contextuelles qui consomment la clé `lexicons`).
#
# Règle d'or : un `validator` doit exister dans
# `anonymisation.detect.validators.VALIDATORS`. Un nom absent fait échouer le
# chargement (voir PatternConfigError), jamais une dégradation silencieuse.
#
# `context_boost` / `deny_context` sont évalués sur une fenêtre de ±40
# caractères autour du match, en minuscules.

patterns:
  # --------------------------------------------------------------------- #
  # Identifiants directs — DIR_*
  # --------------------------------------------------------------------- #
  - id: email
    qi_category: DIR_EMAIL
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b[A-Za-z0-9][A-Za-z0-9._%+-]*@[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?(?:\.[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?)+\b'
    validator: validate_email
    confidence: 0.98
    context_boost: []
    deny_context: ["exemple.com", "example.com", "lorem", "test@test"]

  - id: phone_fr
    qi_category: DIR_PHONE
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["fr"]
    regex: '(?:(?:\+33|0033)\s?[1-9]|0[1-9])(?:[\s.-]?\d{2}){4}'
    validator: validate_phone_fr
    confidence: 0.95
    context_boost: ["tél", "téléphone", "portable", "appelez", "joignable"]
    deny_context: []

  - id: phone_international
    qi_category: DIR_PHONE
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\+\d{1,3}(?:[\s.-]?\d{2,4}){2,5}'
    validator: validate_phone_generic
    confidence: 0.85
    context_boost: ["phone", "call", "tel", "mobile"]
    deny_context: []

  - id: iban
    qi_category: DIR_ACCOUNT
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["*"]
    ignore_case: false
    regex: '\b[A-Z]{2}\d{2}(?:\s?[A-Z0-9]{1,4}){2,8}\b'
    validator: validate_iban
    confidence: 0.97
    context_boost: ["iban", "virement", "rib"]
    deny_context: []

  - id: bic
    qi_category: DIR_ACCOUNT
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["*"]
    ignore_case: false
    regex: '\b[A-Z]{6}[A-Z0-9]{2}(?:[A-Z0-9]{3})?\b'
    validator: validate_bic
    confidence: 0.6
    context_boost: ["bic", "swift"]
    deny_context: []

  - id: credit_card
    qi_category: DIR_ACCOUNT
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b(?:\d{4}[ -]?){3}\d{1,4}\b'
    validator: luhn
    confidence: 0.9
    context_boost: ["carte", "card", "cb", "visa", "mastercard"]
    deny_context: []

  - id: nir
    qi_category: DIR_ID_NUMBER
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["fr"]
    regex: '\b[127][ ]?\d{2}[ ]?(?:0[1-9]|1[0-2])[ ]?(?:2[AB]|\d{2})[ ]?\d{3}[ ]?\d{3}[ ]?\d{2}\b'
    validator: validate_nir
    confidence: 0.97
    context_boost: ["sécurité sociale", "nir", "num", "vitale"]
    deny_context: []

  - id: siren
    qi_category: DIR_ID_NUMBER
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["fr"]
    regex: '\b\d{3}[ ]?\d{3}[ ]?\d{3}\b'
    validator: validate_siren
    confidence: 0.75
    context_boost: ["siren", "entreprise", "société"]
    deny_context: []

  - id: siret
    qi_category: DIR_ID_NUMBER
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["fr"]
    regex: '\b\d{3}[ ]?\d{3}[ ]?\d{3}[ ]?\d{5}\b'
    validator: validate_siret
    confidence: 0.85
    context_boost: ["siret", "établissement"]
    deny_context: []

  - id: url
    qi_category: DIR_ONLINE_ID
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\bhttps?://[^\s<>"''`]+'
    confidence: 0.9
    context_boost: []
    deny_context: ["example.com", "exemple.fr", "localhost"]

  - id: ipv4
    qi_category: DIR_DEVICE_ID
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
    validator: validate_ipv4
    confidence: 0.85
    context_boost: ["ip", "adresse ip", "serveur"]
    deny_context: []

  - id: ipv6
    qi_category: DIR_DEVICE_ID
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '(?<![0-9A-Za-z:])[0-9A-Fa-f]{1,4}(?::[0-9A-Fa-f]{0,4}){2,7}(?![0-9A-Za-z:])'
    validator: validate_ipv6
    confidence: 0.85
    context_boost: ["ip", "ipv6"]
    deny_context: []

  - id: mac_address
    qi_category: DIR_DEVICE_ID
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["*"]
    regex: '\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'
    validator: validate_mac
    confidence: 0.95
    context_boost: ["mac", "adresse mac"]
    deny_context: []

  - id: uuid
    qi_category: DIR_DEVICE_ID
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["*"]
    regex: '\b[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\b'
    validator: validate_uuid
    confidence: 0.9
    context_boost: ["uuid", "identifiant", "session", "id"]
    deny_context: []

  - id: api_key
    qi_category: DIR_ACCOUNT
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b(?:sk|pk|api|key|token|secret)[-_][A-Za-z0-9]{12,64}\b|\b[A-Fa-f0-9]{32,64}\b'
    confidence: 0.55
    context_boost: ["clé api", "api key", "token", "secret", "bearer", "authorization"]
    deny_context: []

  - id: file_path
    qi_category: SUP_ENVIRONMENT
    identifier_type: QUASI
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '(?:[A-Za-z]:\\(?:[^\\/:*?"<>|\r\n]+\\)*[^\\/:*?"<>|\r\n]+)|(?:/(?:[^/\s]+/)+[^/\s]+\.[A-Za-z0-9]{1,5})'
    confidence: 0.6
    context_boost: ["chemin", "fichier", "path", "file", "dossier"]
    deny_context: []
  - id: hostname
    qi_category: SUP_ENVIRONMENT
    identifier_type: QUASI
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+(?:[A-Za-z]{2,63}|internal|local)\b'
    confidence: 0.55
    context_boost: ["host", "hostname", "serveur", "server", "hôte"]
    deny_context: ["example.com", "example.org", "localhost"]

  - id: case_ref
    qi_category: DIR_CASE_REF
    identifier_type: DIRECT
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b(?:ticket|dossier|case|réf(?:érence)?|ref)\s*[:#nN°]*\s*[A-Z]{0,4}-?\d{3,10}\b'
    confidence: 0.75
    context_boost: []
    deny_context: []

  - id: amount
    qi_category: GEN_SOCIOECON
    identifier_type: QUASI
    granularity: EXACT
    stability: VOLATILE
    languages: ["*"]
    regex: '\b\d{1,3}(?:[ .]\d{3})*(?:[,.]\d{2})?\s?(?:€|EUR|euros?|\$|USD|£|GBP)\b'
    confidence: 0.6
    context_boost: ["salaire", "revenu", "prime", "gagne", "paie", "salary", "income"]
    deny_context: []

  - id: date_numeric
    qi_category: GEN_DATE_EVENT
    identifier_type: QUASI
    granularity: EXACT
    stability: STABLE
    languages: ["*"]
    regex: '\b\d{1,2}[/.-]\d{1,2}[/.-]\d{2,4}\b'
    validator: validate_date
    confidence: 0.55
    context_boost: ["né", "naissance", "date", "born", "birth"]
    deny_context: []

  - id: date_text_fr
    qi_category: GEN_DATE_EVENT
    identifier_type: QUASI
    granularity: EXACT
    stability: STABLE
    languages: ["fr"]
    regex: '\b\d{1,2}\s*(?:er)?\s+(?:janvier|février|fevrier|mars|avril|mai|juin|juillet|août|aout|septembre|octobre|novembre|décembre|decembre)\s+\d{4}\b'
    validator: validate_date
    confidence: 0.8
    context_boost: []
    deny_context: []

  - id: date_text_en
    qi_category: GEN_DATE_EVENT
    identifier_type: QUASI
    granularity: EXACT
    stability: STABLE
    languages: ["en"]
    regex: '\b(?:January|February|March|April|May|June|July|August|September|October|November|December)\s+\d{1,2},?\s+\d{4}\b'
    validator: validate_date
    confidence: 0.8
    context_boost: []
    deny_context: []

  - id: plate_fr
    qi_category: DIR_ID_NUMBER
    identifier_type: DIRECT
    granularity: EXACT
    stability: STABLE
    languages: ["fr"]
    regex: '\b[A-Z]{2}-\d{3}-[A-Z]{2}\b'
    confidence: 0.9
    context_boost: ["plaque", "immatriculation", "véhicule"]
    deny_context: []

  - id: postal_code_fr
    qi_category: GEN_GEO
    identifier_type: QUASI
    granularity: RANGE
    stability: STABLE
    languages: ["fr"]
    regex: '\b(?:0[1-9]|[1-8]\d|9[0-8])\d{3}\b'
    confidence: 0.4
    context_boost: ["code postal", "cp", "ville", "adresse", "habite"]
    deny_context: []

